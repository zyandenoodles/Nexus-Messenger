{
  "name": "Build Android APK",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "jobs": {
    "apk": {
      "runs-on": "ubuntu-latest",
      "env": {
        "VITE_SUPABASE_URL": "${{ secrets.VITE_SUPABASE_URL }}",
        "VITE_SUPABASE_ANON_KEY": "${{ secrets.VITE_SUPABASE_ANON_KEY }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Find the project folder",
          "run": "echo \"APP_DIR=$(dirname \"$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)\")\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": 20
          }
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": 21
          }
        },
        {
          "run": "npm install",
          "working-directory": "${{ env.APP_DIR }}"
        },
        {
          "run": "npm run build",
          "working-directory": "${{ env.APP_DIR }}"
        },
        {
          "run": "npx cap add android",
          "working-directory": "${{ env.APP_DIR }}"
        },
        {
          "run": "npx capacitor-assets generate --android --iconBackgroundColor '#0b0d12' --splashBackgroundColor '#0b0d12'",
          "working-directory": "${{ env.APP_DIR }}"
        },
        {
          "run": "npx cap sync android",
          "working-directory": "${{ env.APP_DIR }}"
        },
        {
          "run": "chmod +x gradlew && ./gradlew assembleDebug",
          "working-directory": "${{ env.APP_DIR }}/android"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "nexus-apk",
            "path": "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk"
          }
        }
      ]
    }
  }
}
 
